</style></head><body><header class="demo-bar"><div class="demo-brand">OPCB 界面标准 <span class="demo-caption">候选 v1 · 演示数据</span></div><label class="demo-control">主题 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option><option value="host">继承宿主</option></select></label><label class="demo-control">宽度 <select id="width"><option value="100%">自适应</option><option value="1024px">1024</option><option value="768px">768</option><option value="390px">390</option></select></label><label class="demo-control">状态 <select id="state"><option value="ready">正常</option><option value="loading">加载</option><option value="empty">空内容</option><option value="error">错误</option><option value="denied">无权限</option></select></label><button data-action="report">设计解析</button></header><div class="demo-stage"><div class="opcb-ui demo-app" id="app" data-theme="light"></div></div><div id="modals"></div><div id="toast" aria-live="polite"></div><script>/* Standalone, local-only interaction specimen. No business service or user data. */

function knowledge(){const list=docs.filter(d=>(d.title+d.summary+d.tag).includes(s.query));let content='';if(s.status!=='ready')content=state();else if(!list.length)content='<div class="opcb-empty"><h2>没有找到匹配的资料</h2><p>试试其他标题或主题词</p></div>';else if(s.view==='board')content=`<div class="demo-assets">${list.map(d=>`<article class="demo-asset"><div class="demo-placeholder">${icon('doc')}</div><h3>${d.title}</h3><p class="demo-subtle">${d.summary}</p><div class="demo-meta">${chip(d.tag,d.tone)}<span>${d.date}</span></div>${button('查看资料','select:'+d.id)}</article>`).join('')}</div>`;else content=`<div id="list"><div class="demo-group-heading"><h2 class="opcb-section-title">${s.query?'搜索结果':'最近更新'}</h2><span class="demo-subtle">${list.length} 份示例资料</span></div>${list.map(row).join('')}</div>`;return top('产品与市场研究','用稳定的结构浏览资料，用独立的工作面阅读正文。',button('问本集合','ask','quiet','spark'))+`<div class="demo-search"><input class="opcb-input" id="search" aria-label="搜索当前集合" placeholder="搜索标题、主题或摘要" value="${esc(s.query)}"></div>`+filters()+`<div id="browse-results">${content}</div><p class="demo-footer-note">所有标题与正文均为交互演示内容，不代表当前知识库的真实收录状态。</p>`;}
function taskpage(){return top('研究与内容整理','按状态分列，切换列表时保留同一批任务。',button('筛选说明','filters','quiet','search'))+filters()+(s.status!=='ready'?state():s.view==='board'?`<div class="opcb-board">${['待整理','进行中','待审阅'].map(c=>`<section class="opcb-column"><h2 class="demo-column-heading">${c}<span>${tasks.filter(t=>t.column===c).length}</span></h2>${tasks.filter(t=>t.column===c).map(t=>`<article class="demo-board-card"><button class="demo-row-open" data-action="select:${t.id}">${t.title}</button><p>${t.summary}</p><div class="demo-meta">${chip(t.tag)}<span>示例任务</span></div></article>`).join('')}</section>`).join('')}</div>`:`${tasks.map(t=>row({...t,kind:t.column,date:'示例排期',tone:'neutral'})).join('')}`);}
function assets(){return top('内容素材','有真实图片时显示图片，没有原件时明确说明。',button('预览说明','assetinfo'))+filters()+(s.status!=='ready'?state():`<div class="demo-assets"><article class="demo-asset"><div class="demo-cover" role="img" aria-label="示例构图：纸张与色块，非真实业务素材"><span></span><span></span><span></span></div><h3>内容方向 · 版式示意</h3><p class="demo-subtle">用内容特征帮助识别，图片与说明分别呈现。</p><div class="demo-meta">${chip('构图示例','info')}${chip('非业务素材')}</div>${button('查看示例','select:a1')}</article><article class="demo-asset"><div class="demo-placeholder">${icon('image')}</div><h3>产品图片 · 待接入原件</h3><p class="demo-subtle">只有元数据时保留标题与属性，不补造封面。</p><div class="demo-meta">${chip('缺少原件','warning')}</div>${button('查看属性','select:a2')}</article><article class="demo-asset"><div class="demo-placeholder">${icon('doc')}</div><h3>研究摘录 · 文本素材</h3><p class="demo-subtle">文字材料直接露出摘要，保留来源与时间。</p><div class="demo-meta">${chip('文字资料')}</div>${button('查看资料','select:d1')}</article></div>`);}
function people(){return top('人员与访问','选择一个身份查看权限，建议修改与已保存状态分开。',button('权限说明','permissions'))+(s.status!=='ready'?state():`<div class="demo-notice">此处是权限组件演示。开关仅改变当前页面的示例状态，不会写入服务器。</div><div class="demo-permission-list">${[{id:'p1',title:'资料阅读者 · 示例身份',summary:'查看允许访问的资料与引用',tag:'读取',tone:'info'},{id:'p2',title:'资料管理员 · 示例身份',summary:'管理集合与人员，独立于阅读权限',tag:'管理',tone:'warning'}].map(d=>row({...d,kind:'个人身份',date:'演示'})).join('')}</div>`);}
function reader(){const d=s.readingDoc||docs[0];const sections={
d1:[['先看结论，再核对依据','每份研究保留清楚的范围、来源和更新时间。摘要帮助快速判断相关性，原文提供完整上下文。两者应明确区分，并能从摘要回到出处。'],['把资料关联起来','同一个对象可以出现在集合、列表和问答结果中。标题、类型和来源保持稳定，切换视图不会改变它的身份。']],
d2:[['从产品价值出发','表达方向先说明产品能帮助谁解决什么问题，再选择内容形式。不同方向的材料分别保留范围与依据。'],['围绕使用场景组织','把受众关心的问题、真实场景与内容语气放在一起比较。暂未确认的方向用明确的待验证状态呈现。']],
d3:[['已确认的内容','会议记录中的结论需要能回到原文核对。这个段落为组件演示，不代表真实会议结论。'],['待核对的问题','未形成结论的问题单独成组，并保留来源与后续核对入口。']],
d4:[['按主题整理入口','来源索引保留标题、资料类型与内容摘要。打开来源前先判断它与当前问题的关系。'],['保留出处与时效','引用与原文分开标记，来源的更新时间与资料本身的数据截止日期分别呈现。']]
}[d.id]||[['内容说明',d.summary]];return `<div class="demo-reader">${top(d.title,'正文示例 · 结构与阅读尺度演示',button('返回资料','back','quiet','back'))}<div class="demo-meta">${chip(d.kind||'资料示例','info')}<span>示例内容</span><span>更新于 ${d.date||'示例时间'}</span></div>${s.status!=='ready'?state():`<p>${d.summary}</p>${sections.map(([heading,text])=>`<h2>${heading}</h2><p>${text}</p>`).join('')}<blockquote>阅读过程中的提问围绕当前资料展开。回答应带回可以核对的来源。</blockquote><h2>结构化信息</h2><table class="opcb-table"><caption>通用结构演示</caption><thead><tr><th>场景</th><th>优先呈现</th></tr></thead><tbody><tr><td>集合浏览</td><td>标题、摘要、类型与时间</td></tr><tr><td>预览详情</td><td>范围、来源、相关片段</td></tr><tr><td>完整正文</td><td>章节、引用与完整上下文</td></tr></tbody></table><h2>相关资料</h2>${row(docs.find(item=>item.id!==d.id))}<p class="demo-subtle">以上为虚构文本，仅用于检查中文阅读、表格和引用的呈现。</p>`}</div>`;}
function components(){return top('OPCB 界面标准','候选 v1 · 观察、估测与设计制定值分开记录。',button('解析依据','report','quiet','doc'))+`<section class="demo-component-section"><h2 class="opcb-section-title">表面与文字</h2><div class="demo-swatch-grid">${[['工作面','--opcb-surface'],['次级表面','--opcb-inset'],['框架','--opcb-frame'],['主要文字','--opcb-text'],['辅助文字','--opcb-muted'],['主要动作','--opcb-accent-strong']].map(([l,v])=>`<div class="demo-swatch"><span style="background:var(${v})"></span>${l}<div class="demo-token">${v}</div></div>`).join('')}</div></section><section class="demo-component-section"><h2 class="opcb-section-title">动作与状态</h2><div class="opcb-toolbar">${button('主要动作','sample','primary')}${button('次要动作','sample')}${button('危险动作','danger','danger')}<button class="opcb-button" disabled>不可用</button>${ib('command','搜索示例','search')}</div><div class="opcb-toolbar" style="margin-top:16px">${chip('一般')}${chip('来源可用','success')}${chip('等待核对','warning')}${chip('读取失败','danger')}${chip('资料主题','info')}</div><p class="demo-subtle">分类颜色与业务状态分别定义。选中、键盘焦点、加载与保存反馈也分别表达。</p></section><section class="demo-component-section"><h2 class="opcb-section-title">排版层级</h2><h3 class="opcb-heading">内容有明确的主次</h3><p style="font-size:18px;line-height:1.75">正文 18px，行高 1.75。内容标题可以圆润，菜单与控件保持系统字体。</p><p class="demo-subtle">辅助文字 14px；文字大小与视觉密度分别设置。</p></section><section class="demo-component-section"><h2 class="opcb-section-title">统一但不强制同一版式</h2><dl class="demo-definition"><dt>知识资料</dt><dd>集合、对象列表、侧边预览与独立正文</dd><dt>任务</dt><dd>状态分组、列表与看板，保留相同对象</dd><dt>素材</dt><dd>图文预览与属性，没有图片不虚构封面</dd><dt>配置管理</dt><dd>字段说明、权限与保存反馈，沿业务授权</dd></dl></section><section class="demo-component-section"><h2 class="opcb-section-title">可读性设置</h2><div class="demo-settings"><label><span>紧凑密度<small>保持触控目标，减少对象行的外部留白</small></span><input type="checkbox" id="density" ${s.density==='compact'?'checked':''}></label><label><span>大字检查<small>检查长标题、摘要与属性是否仍可读</small></span><input type="checkbox" id="large-text" ${s.large?'checked':''}></label></div></section>`;}
function inspect(){const d=s.selected;if(!d)return '';let body='';if(d.id.startsWith('p'))body=`<p class="demo-subtle">示例身份的访问设置。Agent 读取继承与管理权限分别表达。</p><div class="demo-settings">${[['reader','读取资料','允许查看授权集合中的内容'],['agent','Agent 继承读取','在所属人允许范围内读取'],['admin','管理权限','独立授权，不随读取自动获得']].map(([key,title,desc])=>`<label><span>${title}<small>${desc}</small></span><input type="checkbox" data-permission="${key}" aria-label="${title}" ${s.permissions[key]?'checked':''}></label>`).join('')}</div><div class="demo-settings-buttons">${button('保存示例','save','primary')}<span class="demo-subtle" role="status">${s.saved?'已在本页保存':'尚未保存'}</span></div>`;else body=`<div class="demo-meta">${chip(d.kind||'资料示例','info')}${chip('演示数据')}</div><dl><div class="demo-property"><dt>所属集合</dt><dd>${d.folder||'示例集合'}</dd></div><div class="demo-property"><dt>来源</dt><dd>组件预览内的虚构资料</dd></div><div class="demo-property"><dt>更新时间</dt><dd>${d.date||'示例时间'}</dd></div></dl><div class="demo-divider"></div><h3 class="opcb-section-title">内容预览</h3><p class="demo-subtle">${d.summary}</p><p class="demo-subtle">${d.id==='a2'?'原件尚未接入，只呈现已知属性。':'同一份资料在列表、预览和正文中保持一致的标题与来源。'}</p>${d.id==='a2'?'<button class="opcb-button" disabled>原件暂不可用</button>':d.id==='a1'?button('查看示例说明','assetinfo','primary'):button(d.id.startsWith('t')?'查看任务结构':'打开完整正文',d.id.startsWith('t')?'taskdetail':'read','primary','arrow')}`;return `<div class="opcb-toolbar" style="justify-content:space-between"><span class="demo-detail-label">${d.id.startsWith('p')?'访问设置':'内容预览'}</span>${ib('close-detail','关闭详情并返回列表','close')}</div><h2 class="demo-detail-title">${d.title}</h2>${body}<div class="demo-divider"></div><p class="demo-subtle">辅助面板按需打开；窄屏进入单独详情，关闭后返回原位置。</p>`;}
let mainScroll=0;
function render({focusId=null}={}){app.dataset.theme=s.theme;app.dataset.inspector=s.selected?'open':'closed';app.dataset.nav=s.nav?'open':'closed';app.dataset.density=s.density;app.dataset.largeText=s.large;app.style.width=s.width;app.innerHTML=`<div class="opcb-shell"><nav class="opcb-nav" aria-label="插件示例导航"><div class="demo-logo">${icon('library')}<div>OPCB<small>统一工作空间 · 候选 v1</small></div></div><div class="demo-nav-group">${pages.map(([id,ic,text])=>`<button class="demo-nav-button" data-action="page:${id}"${s.page===id?' aria-current="page"':''}>${icon(ic)}${text}</button>`).join('')}</div><div class="demo-nav-group"><div class="demo-nav-label">资料集合 · 示例</div><button class="demo-nav-button" data-action="collection">${icon('folder')}产品与市场研究</button><button class="demo-nav-button" data-action="collection">${icon('folder')}会议与工作资料</button></div><div class="demo-nav-group"><div class="demo-nav-label">快速访问</div><button class="demo-nav-button" data-action="command">${icon('search')}搜索资料 <kbd>⌘K</kbd></button><button class="demo-nav-button" data-action="report">${icon('doc')}设计解析与范围</button></div><div class="demo-nav-foot">界面与内容均为演示<br>没有接入业务服务或真实权限</div></nav><main class="opcb-main opcb-panel" id="main-content" tabindex="-1">${({knowledge,tasks:taskpage,assets,people,reader,components}[s.page])()}</main>${s.selected?`<aside class="opcb-inspector opcb-panel" id="inspector" aria-label="选中对象详情" tabindex="-1">${inspect()}</aside>`:''}</div>`;const m=app.querySelector('main');if(m)m.scrollTop=mainScroll;if(focusId)app.querySelector('#'+focusId)?.focus();}
function toast(text){toastRoot.innerHTML=`<div class="demo-toast" role="status">${text}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>toastRoot.innerHTML='',2800);}
let restoreFocus=null;
function closeModal(){modalRoot.innerHTML='';document.querySelector('.demo-app')?.removeAttribute('inert');document.querySelector('.demo-bar')?.removeAttribute('inert');restoreFocus?.focus();}
function dialog(title,body){restoreFocus=document.activeElement;document.querySelector('.demo-app')?.setAttribute('inert','');document.querySelector('.demo-bar')?.setAttribute('inert','');modalRoot.innerHTML=`<div class="opcb-ui demo-modal-backdrop" data-theme="${s.theme}"><section class="demo-modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"><div class="opcb-toolbar"><h2 id="dialog-title">${title}</h2>${ib('close-modal','关闭对话框','close')}</div>${body}</section></div>`;modalRoot.querySelector('input,button')?.focus();}
function act(action){if(action.startsWith('page:')){s.page=action.slice(5);s.selected=null;s.highlighted=null;s.query='';s.nav=false;mainScroll=0;s.status='ready';render();app.querySelector('main')?.focus();return;}if(action.startsWith('select:')){const id=action.slice(7);s.highlighted=id;mainScroll=app.querySelector('main')?.scrollTop||0;s.selected=[...docs,...tasks,{id:'p1',title:'资料阅读者 · 示例身份'},{id:'p2',title:'资料管理员 · 示例身份'},{id:'a1',title:'内容方向 · 版式示意',summary:'用内容特征帮助识别，图片与说明分别呈现。'},{id:'a2',title:'产品图片 · 待接入原件',summary:'只有元数据时保留标题、已知属性和缺失状态。'}].find(d=>d.id===id);if(id.startsWith('p')){s.permissionStore ||= {};s.savedStore ||= {};s.permissions=s.permissionStore[id] ||= {reader:true,agent:true,admin:id==='p2'};s.saved=s.savedStore[id]||false;}s.nav=false;render();app.querySelector('#inspector')?.focus();return;}if(action.startsWith('view:')){s.view=action.slice(5);render();return;}switch(action){case 'nav':s.nav=!s.nav;render();break;case 'close-detail':{const id=s.selected?.id;s.selected=null;render();app.querySelector(`[data-action="select:${id}"]`)?.focus();break;}case 'read':if(s.page!=='reader'){s.readingBack=s.page;s.readingScroll=app.querySelector('main')?.scrollTop||mainScroll;s.readingSelected=s.selected?.id;}s.readingDoc=s.selected;s.page='reader';s.selected=null;mainScroll=0;render();app.querySelector('main')?.focus();break;case 'back':s.page=s.readingBack||'knowledge';s.selected=null;s.highlighted=s.readingSelected;mainScroll=s.readingScroll||0;render();break;case 'reset':s.status='ready';document.querySelector('#state').value='ready';render();break;case 'collection':s.page='knowledge';s.selected=null;s.query='';render();toast('集合入口演示：当前展示同一组示例资料');break;case 'save':s.saved=true;s.savedStore ||= {};s.savedStore[s.selected.id]=true;render();toast('示例设置已保存在本页，没有写入业务服务');break;case 'ask':dialog('问当前集合',`<p class="demo-subtle">问答组件演示 · 范围：产品与市场研究</p><p>示例回答：研究先明确范围，再核对来源；内容呈现支持从摘要回到原文。</p><h3>参考资料</h3>${row(docs[0])}<p class="demo-subtle">此回答为预置演示文本，未调用 Agent 或知识库检索。</p>`);break;case 'report':dialog('解析结论与标准范围',`<p><strong>主参考：Woday。辅助参考：Sphere 双栏笔记。</strong></p><ol><li>统一深色框架与内容工作面，详情、收件区按需组合，正文可展开。</li><li>标题、摘要、属性分层。Rounded只作为内容标题变体。</li><li>对象行、标签、工具栏、选择与焦点使用同一套语义。</li><li>插件按实际容器宽度响应，窄屏一次处理一个主要任务。</li><li>布局相同语言、业务各自保留。Browser View原站、宿主聊天和审核卡另有边界。</li></ol><p>精确字体、尺寸、颜色和动效未从Woday原程序恢复。本预览数值为<strong>OPCB制定的候选值</strong>。REA命令行已诊断；当前未取得Woday原生安装包。</p><p>预览只验证设计组件，不代表全部插件已适配、安装或完成iPad原生验收。</p><p>出处：<a href="https://www.woday.app/" target="_blank" rel="noreferrer">Woday 官网</a> · <a href="https://x.com/0xSphere/status/2049083794854932696" target="_blank" rel="noreferrer">Sphere 原帖</a></p>`);break;case 'command':if(modalRoot.querySelector('#command-search')){modalRoot.querySelector('#command-search').focus();break;}if(modalRoot.firstChild)closeModal();dialog('快速查找资料',`<p class="demo-subtle">搜索样例 · ⌘K / Ctrl+K 打开，Esc 关闭</p><input class="opcb-input" id="command-search" placeholder="输入资料标题" aria-label="快速搜索示例资料"><div id="command-results">${docs.map(row).join('')}</div>`);modalRoot.querySelector('input')?.focus();break;case 'states':dialog('状态契约',`<p>加载、空内容、错误和无权限分别呈现。重试保留当前范围，撤权不显示旧正文，保存反馈只在实际回读后确认。</p><p>本页顶部状态切换仅用于观察组件，演示动作不会访问真实服务。</p>`);break;case 'danger':dialog('危险动作需明确对象',`<p>删除和撤权必须说明对象、影响与是否可以恢复。本演示没有连接任何删除服务。</p>${button('返回组件','close-modal')}`);break;case 'taskdetail':dialog('任务详情结构',`<h3>${esc(s.selected?.title||'示例任务')}</h3><p>标题、状态、时间、负责人、来源和子任务分组呈现。列表与看板保留同一对象身份。</p><p>实际写入与拖放排序需要各插件自己的业务契约，本预览不伪造持久化。</p>`);break;case 'permissions':dialog('权限状态与设计',`<p>个人读取、Agent继承与管理权限分别展示。关闭读取不能仅改变开关颜色；正式插件必须等待服务器确认后再显示已保存。</p>`);break;case 'assetinfo':dialog('素材呈现规则',`<p>仅有元数据时用文字与缺失状态；只有真实图片可用时才显示业务缩略图。本页色块构图标注为演示。</p>`);break;case 'filters':dialog('筛选与视图',`<p>切换列表和看板时保留数据范围、筛选、选中对象与返回位置。状态看板与日期看板使用不同的分组含义。</p>`);break;case 'sample':toast('组件交互反馈示例');break;case 'close-modal':closeModal();break;}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(modalRoot.contains(b)&&a.startsWith('select:'))closeModal();act(a);});
document.addEventListener('input',e=>{if(e.target.id==='search'){s.query=e.target.value;const fragment=document.createElement('template');fragment.innerHTML=knowledge();const source=fragment.content.querySelector('#browse-results'),target=app.querySelector('#browse-results');if(source&&target)target.replaceChildren(...source.childNodes);}if(e.target.id==='command-search'){modalRoot.querySelector('#command-results').innerHTML=docs.filter(d=>d.title.includes(e.target.value)).map(row).join('')||'<p>没有找到匹配资料</p>';}});
document.addEventListener('change',e=>{if(e.target.id==='theme'){s.theme=e.target.value;render();}if(e.target.id==='width'){s.width=e.target.value;render();}if(e.target.id==='state'){s.status=e.target.value;s.selected=null;render();}if(e.target.id==='density'){s.density=e.target.checked?'compact':'comfortable';render();}if(e.target.id==='large-text'){s.large=e.target.checked;render();}if(e.target.dataset.permission){s.permissions[e.target.dataset.permission]=e.target.checked;s.saved=false;s.savedStore[s.selected.id]=false;const status=app.querySelector('.demo-settings-buttons [role=status]');if(status)status.textContent='尚未保存';}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();act('command');}if(e.key==='Escape'){if(modalRoot.firstChild)closeModal();else if(s.nav){s.nav=false;render();}else if(s.selected)act('close-detail');}if(e.key==='Tab'&&modalRoot.firstChild){const f=[...modalRoot.querySelectorAll('button:not([disabled]),input,a[href],[tabindex="0"]')];if(!f.length)return;const first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
window.OPCBPreview={state:s,render,act};render();
})();
</script></body></html>
