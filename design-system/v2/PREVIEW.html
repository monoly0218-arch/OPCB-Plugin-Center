function sphere(){const categories=[['▣','Today','今天','3','#caa000'],['▣','Inbox','收件区','8','#008bb7'],['▰','Scheduled','已安排','4','#c346b9'],['‼','Important','重点','12','#d63870'],['●','Done','已完成','6','#419642'],['▰','Archive','归档','9','#918b7c']];const projects=[['Phase · Identity v3','产品与市场研究','8','#dfb000'],['Meeting Notes','会议与工作资料','44','#b6b5b0'],['Studio Sphere Internal','项目资料','124','#ed5f24'],['Personal Notes','阅读与摘录','8','#72c7af']];const current=projects[S.project];const projectItems=PROJECT_ITEMS[S.project];const rows=projectItems.filter(d=>S.tab==='all'||S.tab==='done'?S.tab!=='done'||S.done.has(d.id):S.tab==='today'?d.scope==='today':d.scope==='week');return `<div class="v2-dual"><section class="v2-collections"><h1>${labels('My Notes','我的资料')}</h1><div class="v2-tiles">${categories.map(([i,en,zh,n,c],j)=>`<button class="v2-tile" data-action="category:${j}" aria-label="${labels(en,zh)}"><span class="v2-identity" style="color:${c}" aria-hidden="true">${i}</span>${labels(en,zh)}<span class="v2-count">${n}</span></button>`).join('')}</div><p class="v2-projects-label">${labels('Projects','业务集合')}</p>${projects.map(([en,zh,n,c],i)=>`<button class="v2-project" data-action="project:${i}" aria-current="${S.project===i}"><span class="v2-dot" style="--identity:${c}" aria-hidden="true"></span>${labels(en,zh)}<span class="v2-count">${n}</span></button>`).join('')}</section><section class="v2-current" tabindex="-1"><div class="v2-mobile-back">${tool('←','dualback',labels('Back to collections','返回集合'))}</div><h1>${labels(current[0],current[1])}</h1><p class="v2-subtitle">${labels(projectItems.filter(d=>d.scope==='today').length+' new tasks today','今日新增 '+projectItems.filter(d=>d.scope==='today').length+' 项 · 演示')}</p><div class="v2-tabs" role="group" aria-label="${labels('Filter tasks','筛选内容')}">${[['all','All','全部'],['today','Today 3','今天 3'],['week','This Week','本周'],['done','Done','已完成']].map(([id,en,zh])=>`<button data-action="tab:${id}" aria-pressed="${S.tab===id}">${labels(en,zh)}</button>`).join('')}</div>${S.status!=='ready'?state():filtered(rows).map(d=>task(d)+(d.id==='s3'?`<div class="v2-children">✓ ${labels('Light Primary, Dark Primary','标题与正文层级')}<br>✓ ${labels('Mark only, wordmark only','控件与内容身份')}<br>○ ${labels('Lockup horizontal','横屏与窄屏布局')}<br>○ ${labels('Padding Guidelines','间距与状态说明')}</div>`:'')).join('')||state()}</section></div>`;}
function render({focus}={}){const root=$('#workspace');const samePage=root.dataset.page===S.page;const scroll=samePage?(root.querySelector('.v2-main')?.scrollTop||0):0;const boardScroll=samePage?(root.querySelector('.v2-board')?.scrollLeft||0):0;root.dataset.page=S.page;root.lang=S.lang==='en'?'en':'zh-CN';root.dataset.theme=S.theme;root.dataset.language=S.lang;root.dataset.layout=S.page==='sphere'?'dual':'work';root.dataset.detail=S.detail?'open':'closed';root.dataset.nav=S.nav?'open':'closed';root.dataset.dualDetail=S.dual?'open':'closed';const isSphere=S.page==='sphere';const nav=[['today','Today','今天'],['upcoming','Upcoming','近期安排'],['calendar','Calendar','日历'],['notes','Notes','资料'],['tasks','Tasks','任务'],['events','Events','事件']];root.innerHTML=`<div class="v2-shell"><div class="v2-global"><button class="v2-mobile-nav" data-action="nav" aria-label="${labels('Open navigation','展开导航')}" aria-expanded="${S.nav}">☰</button><span class="v2-brand">${isSphere?'OPCB · NOTES':'OPCB · WORKSPACE'}</span><label class="v2-search"><span aria-hidden="true">${svg('search')}</span><input id="search" aria-label="${labels('Search current view','搜索当前视图')}" placeholder="${labels('Search, or create anything…','搜索当前资料…')}" value="${esc(S.query)}"><kbd>⌘K</kbd></label></div><nav class="v2-nav" aria-label="${labels('Workspace navigation','工作区导航')}">${nav.map(([id,en,zh])=>`<button data-action="page:${id==='upcoming'?'board':id==='notes'?'knowledge':'tasks'}" ${S.page===(id==='upcoming'?'board':id==='notes'?'knowledge':id)?'aria-current="page"':''}><span class="v2-nav-icon" aria-hidden="true">${id==='today'?icons[id]:svg({upcoming:'board',calendar:'library',notes:'menu',tasks:'check',events:'document'}[id])}</span>${labels(en,zh)}</button>`).join('')}<p class="v2-nav-label">${labels('Favorites','收藏')} ⌄</p><button data-action="page:knowledge"><span aria-hidden="true">⭐</span>${labels('Welcome to Woday','产品与市场研究')}</button><p class="v2-nav-label">${labels('Recent','最近')} ⌄</p>${[['🏵',"Everything Woday ca…",'经营与研究资料'],['🗺','Weekend in Lisbon','会议与工作资料'],['🚀','Product launch plan','产品方向讨论'],['💡','App ideas','选题与内容灵感']].map(([i,en,zh])=>`<button data-action="page:knowledge"><span aria-hidden="true">${i}</span>${labels(en,zh)}</button>`).join('')}<p class="v2-nav-label">${labels('Folders','文件夹')} ⌄</p><button data-action="page:knowledge">▱　${labels('Work','工作')}</button><button data-action="page:sphere">▱　${labels('Collections','集合双栏')}</button></nav><div class="v2-content">${isSphere?sphere():`<main class="v2-panel v2-main">${({tasks,board,knowledge,reader}[S.page]||tasks)()}</main>${S.detail&&S.status==='ready'?details():''}`}</div></div>`;$('#reference').hidden=!S.compare;$('#reference-img').src=REFS[S.page]||REFS.tasks;$('#reference-label').textContent=S.page==='sphere'?'Sphere 原作（含设备外框，未作等比例像素比较）':'Woday 原图 · 相同画幅与英文任务内容';$('#compare').checked=S.compare;$('#scene').value=S.page;$('#language').value=S.lang;$('#theme').value=S.theme;$('#status').value=S.status;$('#note').textContent=S.lang==='en'?'英文用于对照原图；图标、字体和细节仍是近似重建。':'中文版沿用校准结构；文字为演示，未接入业务服务。';if(root.querySelector('.v2-main'))root.querySelector('.v2-main').scrollTop=scroll;if(root.querySelector('.v2-board'))root.querySelector('.v2-board').scrollLeft=boardScroll;if(focus)root.querySelector(focus)?.focus();}
function act(a){if(a.startsWith('page:')){S.page=a.slice(5);S.detail=S.page==='tasks'?'push':null;S.query='';S.nav=false;S.dual=false;render();return;}if(a.startsWith('done:')){const id=a.slice(5);S.done.has(id)?S.done.delete(id):S.done.add(id);render({focus:`[data-action="${a}"]`});return;}if(a.startsWith('open:')){const id=a.slice(5);if(S.page==='sphere'){notify(labels('Selected: ','已选中：')+name(PROJECT_ITEMS.flat().find(d=>d.id===id)));return;}if(![...DATA,...DOCS].some(d=>d.id===id)){notify('日程为展示示例，没有连接编辑服务');return;}S.detail=id;render({focus:'.v2-detail'});return;}if(a.startsWith('project:')){S.project=+a.slice(8);S.dual=true;render({focus:'.v2-current'});return;}if(a.startsWith('category:')){const i=+a.slice(9);S.tab=i===4?'done':i===2?'week':i===0?'today':'all';S.dual=true;render({focus:'.v2-current'});return;}if(a.startsWith('tab:')){S.tab=a.slice(4);render({focus:`[data-action="${a}"]`});return;}switch(a){case'close':{const id=S.detail;S.detail=null;render({focus:`[data-action="open:${id}"]`});break;}case'nav':S.nav=!S.nav;render({focus:S.nav?'.v2-nav button':'.v2-mobile-nav'});break;case'dualback':S.dual=false;render({focus:`[data-action="project:${S.project}"]`});break;case'read':S.readingScroll=$('#workspace .v2-main')?.scrollTop||0;S.reading=S.detail;S.detail=null;S.page='reader';render({focus:'.v2-heading'});break;case'back':S.page='knowledge';render({focus:`[data-action="open:${S.reading}"]`});$('#workspace .v2-main').scrollTop=S.readingScroll||0;break;case'retry':S.status='ready';render();break;case'ask':notify('问此集合 · 入口演示，尚未调用 Agent');break;case'sort':notify('当前按示例时间分组；未更改业务数据');break;case'today':$('#workspace .v2-board')?.scrollTo({left:0,behavior:'smooth'});break;}}
function notify(t){$('#feedback').textContent=t;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#feedback').textContent='',3200);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.action);});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='scene')act('page:'+e.target.value);if(id==='language'){S.lang=e.target.value;render();}if(id==='theme'){S.theme=e.target.value;render();}if(id==='status'){S.status=e.target.value;S.detail=null;render();}if(id==='compare'){S.compare=e.target.checked;render();}});
function searchInput(e){if(e.target.id!=='search'||e.isComposing)return;S.query=e.target.value;S.detail=null;const root=$('#workspace');root.dataset.detail='closed';root.querySelector('.v2-detail')?.remove();if(S.page==='sphere')root.querySelector('.v2-content').innerHTML=sphere();else root.querySelector('.v2-main').innerHTML=({tasks,board,knowledge,reader}[S.page]||tasks)();}
document.addEventListener('input',searchInput);
document.addEventListener('compositionend',searchInput);
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();}if(e.key==='Escape'){if(S.nav){S.nav=false;render({focus:'.v2-mobile-nav'});}else if(S.detail)act('close');else if(S.dual)act('dualback');}});
const p=new URLSearchParams(location.search);if(p.has('scene'))S.page=p.get('scene');if(p.has('lang'))S.lang=p.get('lang');if(p.has('theme'))S.theme=p.get('theme');if(S.page!=='tasks')S.detail=null;if(p.has('capture'))document.body.classList.add('capture');window.OPCBCalibration={state:S,render,act};render();
})();
</script></body></html>
